name: Build Debug APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore ] && keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null 2>&1; then
            echo "Valid debug.keystore already exists; skipping generation."
          else
            rm -f debug.keystore
            if [ -s debug.keystore.base64 ]; then
              echo "Decoding debug.keystore from debug.keystore.base64..."
              if ! base64 -d debug.keystore.base64 > debug.keystore || ! keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null 2>&1; then
                echo "Decoded debug.keystore.base64 was invalid; removing and falling back to keytool."
                rm -f debug.keystore
              fi
            fi

            if [ ! -f debug.keystore ]; then
              echo "Generating debug.keystore with JDK 21 keytool..."
              keytool -genkeypair -noprompt \
                -keystore debug.keystore \
                -storetype PKCS12 \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Verify debug keystore
        run: |
          if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
            echo "::error::Expected keystore file 'debug.keystore' does not exist or is empty."
            exit 1
          fi
          if ! keytool -list -keystore debug.keystore -storepass android >/dev/null 2>&1; then
            echo "::error::'debug.keystore' is not a valid Java keystore or storepass 'android' failed."
            exit 1
          fi
          if ! keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey; then
            echo "::error::Configured alias 'androiddebugkey' was not found in 'debug.keystore'."
            exit 1
          fi
          echo "Verified debug.keystore and alias 'androiddebugkey' successfully."

      - name: Run unit tests and build Debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug

      - name: Validate generated Debug APK and calculate SHA-256
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::Expected APK file not found at $APK"
            exit 1
          fi
          echo "=== Debug APK File Details ==="
          ls -la "$APK"
          ls -lh "$APK"

          echo "=== SHA-256 Checksum ==="
          sha256sum "$APK" | tee apk_checksum.txt

          echo "=== APK Archive Integrity (unzip -t) ==="
          unzip -t "$APK" > /dev/null && echo "Archive integrity verified (unzip test OK)."

          echo "=== Signature Verification (apksigner) ==="
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
            echo "Using apksigner: $APKSIGNER"
            "$APKSIGNER" verify --verbose --print-certs "$APK"
          fi

          echo "=== Zipalign Verification ==="
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign -type f 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$ZIPALIGN" ] && [ -x "$ZIPALIGN" ]; then
            echo "Using zipalign: $ZIPALIGN"
            "$ZIPALIGN" -c -v 4 "$APK" > /dev/null && echo "Zipalign 4-byte check passed."
          fi

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: luxa-calculator-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

